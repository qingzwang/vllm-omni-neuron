stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: image
    runtime:
      process: true
      devices: "0-15"
      max_batch_size: 1
    engine_args:
      model_class_name: HunyuanImage3ForCausalMM
      model_stage: diffusion
      dtype: bfloat16
      model_config:
        # Static number of prefix tokens (<bos>, prompt, <boi>, size/ratio tokens) in the
        # compiled graphs.
        max_text_tokens: 1024
      parallel_config:
        # Attention heads and the 64 experts are sharded over the TP ranks (TP=16:
        # 2 query heads and 4 experts per rank).
        tensor_parallel_size: 16
